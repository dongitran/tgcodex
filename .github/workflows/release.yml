name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Prepare release bundle
        run: |
          mkdir -p release
          cp -r dist release/
          cp README.md SECURITY.md package.json release/
          tar -czvf tgcodex-${{ github.ref_name }}-dist.tar.gz -C release .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: tgcodex ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            tgcodex-*.tar.gz
            dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dist as artifact (for manual download)
        uses: actions/upload-artifact@v4
        with:
          name: tgcodex-${{ github.ref_name }}-dist
          path: dist/
